<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StockPilot – Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--sf:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e4e8f0;--ac:#2563eb;--ac2:#e9f0ff;--ok:#047857;--okb:#e1f6ec;--wn:#b45309;--wnb:#fef1d8;--er:#c2342b;--erb:#fdebea;--in:#2563eb;--out:#f59e0b;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f17;--sf:#121823;--tx:#e7ecf4;--mu:#8b97ab;--bd:#222b3a;--ac:#5b93ff;--ac2:#16233f;--ok:#4ade9c;--okb:#10301f;--wn:#f3b556;--wnb:#33270e;--er:#ff8a80;--erb:#3a1b1a;--in:#5b93ff;--out:#f3b556;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f17;--sf:#121823;--tx:#e7ecf4;--mu:#8b97ab;--bd:#222b3a;--ac:#5b93ff;--ac2:#16233f;--ok:#4ade9c;--okb:#10301f;--wn:#f3b556;--wnb:#33270e;--er:#ff8a80;--erb:#3a1b1a;--in:#5b93ff;--out:#f3b556;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}svg{flex:none}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
aside{width:232px;flex:none;background:var(--sf);border-right:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px;padding:2px 8px 16px}.lg{width:32px;height:32px;border-radius:6px;background:var(--ac);color:var(--acx);display:grid;place-items:center}
aside a{display:flex;gap:11px;align-items:center;padding:9px 12px;border-radius:6px;color:var(--mu);cursor:pointer;font-weight:500;margin:2px 0}
aside a:hover{background:var(--bg);color:var(--tx)}aside a.on{background:var(--ac2);color:var(--ac);font-weight:600}
aside .ft{margin:18px 8px 0;padding:12px;border:1px dashed var(--bd);border-radius:6px;color:var(--mu);font-size:12px}
main{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 32px;display:flex;gap:12px;align-items:center}
.srch{flex:1;max-width:460px;display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:6px;padding:8px 12px;color:var(--mu);cursor:pointer;background:var(--bg)}.srch kbd{margin-left:auto;font:11px ui-monospace,monospace;border:1px solid var(--bd);border-radius:4px;padding:1px 6px;background:var(--sf)}
.sp{flex:1}.chip{border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font-size:12.5px;color:var(--mu);display:flex;gap:6px;align-items:center;cursor:pointer;background:var(--sf)}.chip:hover{color:var(--tx)}
.me{width:32px;height:32px;border-radius:6px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:12px}
.pg{padding:26px 32px 60px;max-width:1280px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:25px;margin:0;font-weight:700;letter-spacing:-.02em}h2{margin:0;font-size:18px}h3{margin:0 0 14px;font-size:14px;font-weight:600}.sub{margin:3px 0 0;color:var(--mu)}.ac{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:18px;margin-bottom:18px;box-shadow:var(--sh)}.card.tw{padding:0}.card.tw>h3{padding:16px 18px 4px;margin:0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:500;color:var(--mu);text-align:left;padding:11px 16px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);white-space:nowrap}tbody tr:last-child>td{border-bottom:0}
tr.row{cursor:pointer}tbody tr:hover>td{background:var(--bg)}tr.del td{opacity:.5;text-decoration:line-through}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}.pos{color:var(--ok);font-weight:600}.neg{color:var(--er);font-weight:600}
input,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:8px 11px;min-width:0}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}input[type=checkbox]{width:auto}
.btn{font:inherit;font-size:13px;font-weight:600;background:var(--ac);color:var(--acx);border:1px solid var(--ac);border-radius:6px;padding:8px 15px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}.btn:hover{filter:brightness(1.08)}
.btn.s{background:var(--sf);color:var(--tx);border-color:var(--bd)}.btn.s:hover{background:var(--bg);filter:none}.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}.btn.d{background:var(--erb);border-color:transparent;color:var(--er)}.btn.l{padding:11px 20px;font-size:14px}
.lnk{background:none;border:0;color:var(--er);cursor:pointer;font:inherit;font-size:13px}
.b{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:600}
.b.Draft,.b.Low{background:var(--wnb);color:var(--wn)}.b.Posted,.b.OK{background:var(--okb);color:var(--ok)}.b.Cancelled,.b.Out{background:var(--erb);color:var(--er)}
.ch{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.pills button{font:inherit;font-size:13px;font-weight:500;background:var(--sf);border:1px solid var(--bd);color:var(--mu);padding:6px 13px;border-radius:4px;cursor:pointer}.pills button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.av{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}.av.lg{width:52px;height:52px;border-radius:8px;font-size:18px}
.nm{display:flex;gap:12px;align-items:center}.nm b{display:block}.nm span{color:var(--mu);font-size:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:18px}.kp>div{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:18px;box-shadow:var(--sh)}
.kp span{color:var(--mu);font-size:13px}.kp b{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.25}.kp small{color:var(--mu);font-size:12px}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bar{height:6px;border-radius:4px;background:var(--bd);overflow:hidden;width:110px}.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}.bar.w i{background:#e8890c}.bar.e i{background:var(--er)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0;padding-bottom:0}.li .mu,.mu{color:var(--mu);font-size:12.5px}
.fd{display:flex;gap:12px;align-items:center;padding:9px 0}.fd i{font-style:normal;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-weight:700;flex:none}.fd i.in{background:var(--okb);color:var(--ok)}.fd i.out{background:var(--wnb);color:var(--wn)}
.lgd{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:8px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:30}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--sf);z-index:31;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:sl .2s}@keyframes sl{from{transform:translateX(40px);opacity:0}}
.dh{display:flex;gap:14px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--bd)}.dh>div:nth-child(2){flex:1;min-width:0}.db{padding:20px 22px;overflow-y:auto;flex:1}.df{padding:14px 22px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.x{background:none;border:0;font-size:24px;color:var(--mu);cursor:pointer;line-height:1}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:16px 0}.dl div span{display:block;color:var(--mu);font-size:12px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fm label,.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mu);font-weight:500}.fm input,.fm select,.fl input,.fl select{width:100%;color:var(--tx)}.fm label.ck{flex-direction:row;align-items:center;gap:8px}.req{color:var(--er)}
.sgw{position:relative}.sgl{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:5;max-height:300px;overflow:auto}
.sg{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer}.sg:hover,.sg.on{background:var(--ac2)}.sg .mu{margin-left:auto}
.ln{display:grid;grid-template-columns:1fr 80px 118px 92px 78px 24px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.ln select,.ln input{padding:6px 8px}
.stp{display:flex}.stp button{width:30px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;color:var(--tx)}.stp button:first-child{border-radius:6px 0 0 6px}.stp button:last-child{border-radius:0 6px 6px 0}.stp input{width:54px;text-align:center;border-radius:0;border-left:0;border-right:0;padding:6px 2px}
.warn{color:var(--er);font-size:12px}.ok2{color:var(--mu);font-size:12px}
.mo{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:start center;padding:8vh 16px 16px;z-index:50;overflow:auto}
.md{background:var(--sf);border-radius:8px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.md.wd{max-width:640px}.md.xl{max-width:900px}.md.xl .mb{min-height:400px;max-height:62vh;overflow:auto}.md.xl .mh{align-items:center}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd);font-size:16px}.mb{padding:20px}.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--bd)}
.mn{position:absolute;right:0;top:calc(100% + 6px);background:var(--sf);border:1px solid var(--bd);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;min-width:230px;z-index:20}.mn a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:6px;cursor:pointer}.mn a:hover{background:var(--ac2)}
.empty{text-align:center;padding:36px 20px;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}
.sr{width:220px}.tag{font:11px/1 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--mu);border:1px solid var(--bd);border-radius:4px;padding:2px 6px;margin-left:6px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:#0f172a;color:#fff;padding:11px 16px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;z-index:99}#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}#toast.bad{background:var(--er)}#toast button{background:none;border:0;color:var(--acl);font:inherit;font-weight:700;cursor:pointer;margin-left:10px}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--bd)}.brand,.ft{display:none}aside a{white-space:nowrap}.top,.pg{padding-left:14px;padding-right:14px}.chip.hide{display:none}.ln{grid-template-columns:1fr 1fr}.dl{grid-template-columns:1fr}.fm{grid-template-columns:1fr}}

.gt{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);align-items:center}.pgr{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--bd);flex-wrap:wrap}.pgr select{padding:4px 6px}
th.srt{cursor:pointer;user-select:none}th.srt:hover{color:var(--tx)}button:disabled{opacity:.4;cursor:default}.lnk.b2{color:var(--ac);margin-right:8px}
.rpc{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}.rpc button{text-align:left;font:inherit;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:12px;cursor:pointer;color:var(--tx)}.rpc button.on{border-color:var(--ac);background:var(--ac2)}.rpc b{display:block}.rpc span{color:var(--mu);font-size:12px}
.sm{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.sm div{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:8px 14px}.sm span{display:block;color:var(--mu);font-size:12px}
#prn{display:none}
@media print{body>*:not(#prn){display:none!important}#prn{display:block!important}body{display:block;background:#fff;color:#000}.sh{font:11px/1.4 Arial,sans-serif;color:#000}.shh{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}.sh h1{font-size:18px;margin:0}.sh table{width:100%;border-collapse:collapse}.sh th{background:#eee;color:#000;border-bottom:1px solid #000;padding:4px 6px;font-size:10.5px;text-align:left}.sh td{padding:4px 6px;border-bottom:1px solid #ddd;white-space:normal}.sh .r{text-align:right}}

/* compact spacing */
.pg{padding:16px 20px 36px}.top{padding:7px 20px}aside{padding:12px 8px;width:212px}aside a{padding:6px 10px;margin:1px 0}.brand{padding:0 6px 10px}
.hd{margin-bottom:12px}h1{font-size:21px}.card{padding:12px;margin-bottom:12px}.kp{gap:10px;margin-bottom:12px}.kp>div{padding:12px;position:relative;transition:transform .2s,box-shadow .2s}.kp>div:hover{transform:translateY(-2px)}.kp b{font-size:22px}
th{padding:7px 12px}td{padding:7px 12px}.gt{padding:8px 12px}.pgr{padding:6px 12px}.btn{padding:6px 12px}.btn.l{padding:8px 16px}input,select{padding:6px 9px}
.pills{margin-bottom:10px}.g2{gap:12px}.li{padding:8px 0}.fd{padding:6px 0}.dh{padding:14px 18px}.db{padding:14px 18px}.df{padding:10px 18px}.mh{padding:12px 16px}.mb{padding:14px 16px}.mf{padding:10px 16px}.fm{gap:10px}.ln{padding:8px 0}.rpc{gap:8px;margin-bottom:12px}.rpc button{padding:9px 10px}.sm{margin-bottom:10px}.steps{gap:10px;margin-bottom:12px}.sm div{padding:6px 12px}
/* fixed-height tables: about 10 rows, then scroll */
.card.tw{overflow:hidden}.card.tw .tw{max-height:430px;overflow:auto}.card.tw .tw th{position:sticky;top:0;z-index:1;background:var(--sf);box-shadow:0 1px 0 var(--bd)}
td .av{width:28px;height:28px;font-size:11px;border-radius:4px}.th{width:30px;height:30px;object-fit:cover;border-radius:4px;display:block}.th.lg{width:64px;height:64px}img.av{object-fit:cover}
.lnk{display:inline-flex;gap:4px;align-items:center}.ki{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:6px;display:grid;place-items:center}
/* loading */
.spn{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
#pb{position:fixed;top:0;left:0;height:3px;width:0;background:var(--ac);z-index:200;opacity:0;transition:opacity .2s}#pb.on{opacity:1;animation:pb 1.1s ease-in-out infinite}
.sk{background:linear-gradient(90deg,var(--bd),var(--bg),var(--bd));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:4px}.ld{display:flex;gap:8px;align-items:center;color:var(--mu);padding:14px}
/* animations */
@keyframes rot{to{transform:rotate(360deg)}}@keyframes pb{0%{width:0}60%{width:80%}100%{width:96%}}@keyframes sh{to{background-position:-200% 0}}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}@keyframes fi{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}@keyframes gr{from{transform:scaleX(0)}}@keyframes up{from{transform:scaleY(0)}}
.pg>*{animation:fu .35s both}.pg>*:nth-child(2){animation-delay:.05s}.pg>*:nth-child(3){animation-delay:.1s}.pg>*:nth-child(4){animation-delay:.15s}.pg>*:nth-child(5){animation-delay:.2s}
tbody tr{animation:fi .3s both}.md{animation:pop .2s}.mn{animation:pop .15s}.bar i{transform-origin:left;animation:gr .8s ease}svg rect{transform-box:fill-box;transform-origin:bottom;animation:up .7s both}svg circle{animation:fi .9s both}
.btn{transition:transform .12s,filter .12s}.btn:active{transform:scale(.97)}aside a{transition:background .15s,color .15s,transform .15s}aside a:hover{transform:translateX(2px)}
/* login */
#login{position:fixed;inset:0;z-index:150;background:linear-gradient(135deg,var(--acd),var(--ac) 55%,var(--acl));display:grid;place-items:center;padding:16px;transition:opacity .35s,transform .35s}#login.out{opacity:0;transform:scale(1.03)}
.lc{background:var(--sf);border-radius:10px;padding:26px;width:min(380px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;animation:pop .45s}.lc .brand{padding:0 0 6px}.lng{display:flex;gap:6px;justify-content:center;margin-top:8px}.lng button{font:inherit;font-size:12px;background:none;border:1px solid var(--bd);border-radius:6px;padding:3px 9px;cursor:pointer;color:var(--mu)}.lng button.on{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
/* tour */
#tr{position:fixed;inset:0;z-index:120}.hl{position:fixed;border-radius:6px;box-shadow:0 0 0 9999px rgba(10,15,30,.6),0 0 0 3px var(--ac);transition:all .25s;pointer-events:none}.ov2{position:fixed;inset:0;background:rgba(10,15,30,.6)}
.tp{position:fixed;background:var(--sf);border-radius:8px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:pop .25s}.tp h3{margin:2px 0}.tp p{margin:6px 0 12px;color:var(--mu)}
.tourl{margin-top:10px;border:1px dashed var(--bd);color:var(--ac)!important}
.gt{flex-wrap:wrap}.fs{max-width:190px}.gl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mu)}

/* themes: accent colours and modes */
:root{--acx:#fff;--acd:#1e3a8a;--acl:#38bdf8}
:root[data-accent=blue]{--ac:#2563eb;--ac2:#e9f0ff;--acd:#1e3a8a;--acl:#38bdf8;--acx:#fff;}
:root[data-accent=red]{--ac:#dc2626;--ac2:#fdecec;--acd:#7f1d1d;--acl:#fb7185;--acx:#fff;}
:root[data-accent=orange]{--ac:#ea580c;--ac2:#fff0e6;--acd:#7c2d12;--acl:#fdba74;--acx:#fff;--out:#2563eb;}
:root[data-accent=yellow]{--ac:#ca8a04;--ac2:#fef7d6;--acd:#713f12;--acl:#fde047;--acx:#fff;--out:#2563eb;}
:root[data-accent=green]{--ac:#059669;--ac2:#e1f6ec;--acd:#064e3b;--acl:#6ee7b7;--acx:#fff;}
:root[data-accent=teal]{--ac:#0d9488;--ac2:#def7f4;--acd:#134e4a;--acl:#5eead4;--acx:#fff;}
:root[data-accent=purple]{--ac:#7c3aed;--ac2:#f1eaff;--acd:#4c1d95;--acl:#c4b5fd;--acx:#fff;}
:root[data-accent=pink]{--ac:#db2777;--ac2:#fde8f1;--acd:#831843;--acl:#f9a8d4;--acx:#fff;}
:root[data-theme="black"]{--bg:#000;--sf:#0b0b0d;--tx:#f1f1f1;--mu:#9a9aa5;--bd:#26262c;--ok:#4ade9c;--okb:#10301f;--wn:#f3b556;--wnb:#33270e;--er:#ff8a80;--erb:#3a1b1a;--out:#f3b556;--sh:none;color-scheme:dark}

function mcols(k){let c=M[k].c.map(([f,l,t])=>({k:f,l,r:t=='num',v:r=>t=='img'?(r[f]?'Yes':'No'):t.startsWith('fk:')?lbl(t.slice(3),r[f]):t=='bool'?(r[f]?'Yes':'No'):r[f],h:t=='num'?r=>n(r[f]):t=='img'?r=>r[f]?`<img class="th" src="${r[f]}" alt="">`:'<span class="mu">—</span>':null}));
 return c.concat([{k:'_a',l:'',nosort:1,noexp:1,h:r=>r.del?`<button class="lnk b2" onclick="restore('${k}',${r.id})">Restore</button>`:`<button class="lnk b2" onclick="openEdit('${k}',${r.id})">${ic('edit',13)}Edit</button><button class="lnk" onclick="del('${k}',${r.id})">${ic('trash',13)}Delete</button>`}])}
function listPage(k,emb){const all=D[k].filter(r=>!r.del),live=D[k].filter(r=>!r.del).length,btn=`<button class="btn" onclick="openAdd('${k}')">${ic('plus',15)}Add ${SING[k]}</button>`;
 return (emb?`<div class="ac" style="justify-content:flex-end;margin-bottom:14px">${btn}</div>`:`<div class="hd"><div><h1>${H[k]}</h1><p class="sub">${live} record${live==1?'':'s'}<span class="tag">${M[k].n}</span></p></div><div class="ac">${btn}</div></div>`)+grid('m_'+k,mcols(k),all,{cls:r=>r.del?'del':'',name:H[k],pdf:true,filters:(MF[k]||(()=>[]))()})+`<p class="mu">Deleting only marks a record as deleted, so Undo always works.</p>`}
function fields(k,r){return `<div class="fm">`+M[k].c.map((c,i)=>{const id='f_'+c[0],t=c[2],v=r?r[c[0]]:'',rq=i==0?' <span class="req">*</span>':'';
 if(t=='img')return `<label style="grid-column:1/-1">Picture (optional)<input type="file" id="${id}" accept="image/*" onchange="imgPick(this)"><div id="imgp" style="margin-top:6px">${IMGT?`<img class="th lg" src="${IMGT}" alt=""> <button type="button" class="lnk" onclick="IMGT='';imgPrev()">Remove</button>`:'<span class="mu">No picture</span>'}</div></label>`;
 if(t=='bool')return `<label class="ck"><input type="checkbox" id="${id}" ${v?'checked':''}>${c[1]}</label>`;
 return `<label>${c[1]}${rq}`+(t.startsWith('fk:')?`<select id="${id}">${opts(t.slice(3),v)}</select>`:`<input id="${id}" type="${t=='num'?'number':t=='date'?'date':'text'}" value="${t=='date'&&!v?today():esc(v)}">`)+`</label>`}).join('')+`</div>`}
function openAdd(k){IMGT='';closeD();modal('Add '+SING[k],fields(k),['Save '+SING[k]],()=>add(k),k=='itemMaster'||k=='supplier')}
function openEdit(k,id){closeD();const r=D[k].find(x=>x.id==id);IMGT=r.img||'';modal('Edit '+SING[k],fields(k,r),['Save changes'],()=>add(k,r),k=='itemMaster'||k=='supplier')}
function add(k,ex){const m=M[k],o=ex||{id:nid(),t:1,cr:now(),by:who(),lm:'',lmb:'',del:false},t0=Object.assign({},o);
 for(const c of m.c){const e=$('f_'+c[0]),t=c[2];o[c[0]]=t=='img'?IMGT:t=='bool'?e.checked:(t=='num'||t.startsWith('fk:'))?+e.value:e.value}
 const f=o[m.c[0][0]];if(f===''||f==null||(typeof f=='number'&&isNaN(f))){Object.assign(o,t0);toast('Please fill in '+m.c[0][1],1);return false}
 if(ex){o.lm=now();o.lmb=who()}else{D[k].push(o);if(k=='itemMaster')bal(o.id)}
 toast((ex?'Updated ':'Saved ')+SING[k]);render()}
function del(k,id){const r=D[k].find(x=>x.id==id);r.del=true;toast('Deleted',0,['Undo',()=>{r.del=false;render()}]);render()}
function restore(k,id){D[k].find(x=>x.id==id).del=false;toast('Restored');render()}

/* pages */
function dash(){
 const B=D.balance.filter(b=>item(b.item)&&!item(b.item).del),val=B.reduce((s,b)=>s+b.qty*b.avg,0),
 cnt={OK:0,Low:0,Out:0};B.forEach(b=>cnt[stat(b)]++);
 const days=[...Array(14)].map((_,i)=>day(i-13)),inn=days.map(d=>D.move.filter(m=>m.date==d&&m.qty>0&&m.type!='Opening').reduce((s,m)=>s+m.qty*m.cost,0)),out=days.map(d=>D.move.filter(m=>m.date==d&&m.qty<0).reduce((s,m)=>s-m.qty*m.cost,0)),mx=Math.max(1,...inn,...out),
 sI=inn.reduce((a,b)=>a+b,0),sO=out.reduce((a,b)=>a+b,0),
 drs=[].concat(...['purchase','sale'].map(k=>D[k].filter(d=>d.status=='Draft').map(d=>({k,d})))),lows=B.filter(b=>stat(b)!='OK');
 const bars=days.map((d,i)=>{const x=14+i*42;return `<rect x="${x}" y="${170-inn[i]/mx*150}" width="15" height="${inn[i]/mx*150}" rx="3" fill="var(--in)"/><rect x="${x+17}" y="${170-out[i]/mx*150}" width="15" height="${out[i]/mx*150}" rx="3" fill="var(--out)"/><text x="${x+16}" y="190" text-anchor="middle" font-size="10" fill="var(--mu)">${d.slice(8)}</text>`}).join('');
 const tt=B.length||1,C=2*Math.PI*42;let off=0;const seg=[['OK','var(--ok)'],['Low','var(--out)'],['Out','var(--er)']].map(([k,c])=>{const l=cnt[k]/tt*C,r=`<circle cx="60" cy="60" r="42" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return r}).join('');
 return `<div class="hd"><div><h1>Good day, ${esc(ME.name.split(' ')[0])}</h1><p class="sub">Here is how your stock looks today.</p></div><div class="ac"><button class="btn l" onclick="editor('purchase')">${ic('purchase',17)}Receive stock</button><button class="btn s l" onclick="editor('sale')">${ic('sale',17)}Sell or issue</button></div></div>
 <div class="kp"><div>${KI('coin','var(--ac)','var(--ac2)')}<span>Stock value</span><b data-cu="${val}" data-pre="৳ ">৳ ${n(val,0)}</b><small>${B.length} items tracked</small></div><div>${KI('purchase','var(--ok)','var(--okb)')}<span>Stock in (14 days)</span><b class="pos" data-cu="${sI}" data-pre="৳ ">৳ ${n(sI,0)}</b><small>Purchases received</small></div><div>${KI('sale','var(--wn)','var(--wnb)')}<span>Stock out (14 days)</span><b style="color:var(--wn)" data-cu="${sO}" data-pre="৳ ">৳ ${n(sO,0)}</b><small>Sales and issues at cost</small></div><div>${KI('alert','var(--er)','var(--erb)')}<span>Needs attention</span><b>${lows.length+drs.length}</b><small>${lows.length} low · ${drs.length} waiting to post</small></div></div>
 <div class="g2"><div class="card"><h3>Stock in vs out · last 14 days</h3><svg viewBox="0 0 600 196" width="100%" style="display:block">${bars}</svg><div class="lgd"><span><i style="background:var(--in)"></i>Stock in</span><span><i style="background:var(--out)"></i>Stock out</span></div></div>
 <div class="card"><h3>Stock health</h3><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 120 120" width="130" height="130">${seg}<text x="60" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="var(--tx)">${B.length}</text><text x="60" y="74" text-anchor="middle" font-size="10" fill="var(--mu)">items</text></svg><div>${[['OK','In stock','var(--ok)'],['Low','Low stock','var(--out)'],['Out','Out of stock','var(--er)']].map(([k,l,c])=>`<div style="margin:6px 0"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c};margin-right:8px"></i>${l}: <b>${cnt[k]}</b></div>`).join('')}</div></div></div></div>
 <div class="g2"><div class="card"><h3>Needs your attention</h3>`+drs.map(({k,d})=>`<div class="li"><div><b>${d.no}</b> <span class="b Draft">Draft</span><div class="mu">${k=='purchase'?'Purchase':'Sale'} · ৳ ${n(tot(d),0)} · not posted yet</div></div><button class="btn s" onclick="viewDoc('${k}',${d.id})">Review</button></div>`).join('')+lows.map(b=>{const it=item(b.item);return `<div class="li"><div class="nm">${AV(it.name,'',it.img)}<div><b>${esc(it.name)}</b><span>${n(b.qty,2)} ${lbl('unitMaster',it.unit)} left · reorder at ${it.reorder}</span></div></div><button class="btn s" onclick="editor('purchase',${it.id})">Reorder</button></div>`}).join('')+((lows.length+drs.length)?'':'<p class="mu">You are all caught up.</p>')+`</div>
 <div class="card"><h3>Recent activity</h3>`+D.move.slice(-6).reverse().map(m=>{const it=item(m.item),i=m.qty>0;return `<div class="fd"><i class="${i?'in':'out'}">${i?'+':'−'}</i><div style="flex:1;min-width:0"><b>${TY[m.type]} · ${esc(it.name)}</b><div class="mu">${n(Math.abs(m.qty),2)} ${lbl('unitMaster',it.unit)} · ${esc(m.ref)} · ${ago(m.date)}</div></div></div>`}).join('')+`</div></div>`}

function items(){
 const all=D.itemMaster.filter(i=>!i.del).map(i=>{const b=bal(i.id),s=stat(b);return {id:i.id,code:i.code,name:i.name,catId:i.cat,subId:i.sub,sub:lbl('itemSubCategory',i.sub),cat:lbl('itemCategory',i.cat),unit:lbl('unitMaster',i.unit),qty:b.qty,val:b.qty*b.avg,st:s,ratio:b.qty/(i.reorder*3)}}),
 c={All:all.length,Low:all.filter(x=>x.st!='OK').length,OK:all.filter(x=>x.st=='OK').length},rows=all.filter(x=>itf=='All'||(itf=='Low'?x.st!='OK':x.st=='OK'));
 return `<div class="hd"><div><h1>Items</h1><p class="sub">Click an item to see its stock, history and quick actions.<span class="tag">ItemMaster · StockBalance</span></p></div><div class="ac"><button class="btn" onclick="openAdd('itemMaster')">${ic('plus',15)}Add item</button></div></div>
 <div class="pills">${[['All','All'],['OK','In stock'],['Low','Needs reorder']].map(([k,l])=>`<button class="${itf==k?'on':''}" onclick="itf='${k}';if(GS.items)GS.items.page=1;render()">${l} (${c[k]})</button>`).join('')}</div>`+
 grid('items',[C('code','Code'),{k:'name',l:'Item',v:r=>r.name,h:r=>`<div class="nm">${AV(r.name,'',(item(r.id)||{}).img)}<b>${esc(r.name)}</b></div>`},C('cat','Category'),C('sub','Sub-category'),{k:'qty',l:'On hand',r:1,v:r=>r.qty,h:r=>`<b>${n(r.qty,2)}</b>`},C('unit','Unit'),{k:'ratio',l:'Level',noexp:1,v:r=>r.ratio,h:r=>`<div class="bar ${r.st=='Low'?'w':r.st=='Out'?'e':''}"><i style="width:${Math.min(100,Math.round(r.ratio*100))}%"></i></div>`},CN('val','Value'),{k:'st',l:'Status',v:r=>SL[r.st],h:r=>`<span class="b ${r.st}">${SL[r.st]}</span>`}],rows,{click:r=>`openItem(${r.id})`,name:'Items',pdf:true,filters:IF()})}

function openItem(id){
 const it=item(id),b=bal(id),s=stat(b),mv=D.move.filter(m=>m.item==id).slice(-6).reverse(),u=lbl('unitMaster',it.unit);
 drawer(`<div class="dh">${AV(it.name,'lg',it.img)}<div><h2>${esc(it.name)}</h2><div class="mu">${it.code} · ${lbl('itemCategory',it.cat)} / ${lbl('itemSubCategory',it.sub)}</div></div><button class="x" onclick="closeD()">×</button></div>
 <div class="db"><span class="b ${s}">${SL[s]}</span><div class="g3" style="margin-top:14px"><div class="card" style="margin:0"><span class="mu">On hand</span><h2>${n(b.qty,2)} <small class="mu">${u}</small></h2></div><div class="card" style="margin:0"><span class="mu">Avg cost</span><h2>৳ ${n(b.avg)}</h2></div><div class="card" style="margin:0"><span class="mu">Value</span><h2>৳ ${n(b.qty*b.avg,0)}</h2></div></div>
 <div class="dl"><div><span>Sale price</span>৳ ${n(it.price)}</div><div><span>Reorder level</span>${it.reorder} ${u}</div><div><span>Base unit</span>${u}</div><div><span>Buy / sell in</span>${unitsOf(it).map(x=>lbl('unitMaster',x)).join(', ')}</div></div>
 <h3 style="margin-top:22px">Recent activity</h3>`+mv.map(m=>`<div class="fd"><i class="${m.qty>0?'in':'out'}">${m.qty>0?'+':'−'}</i><div style="flex:1"><b>${TY[m.type]}</b><div class="mu">${esc(m.ref)} · ${ago(m.date)}</div></div><div style="text-align:right"><b class="${m.qty>0?'pos':'neg'}">${m.qty>0?'+':''}${n(m.qty,2)}</b><div class="mu">bal ${n(m.after,2)}</div></div></div>`).join('')+`</div>
 <div class="df"><button class="btn g" onclick="editor('purchase',${id})">${ic('purchase',16)}Receive stock</button><button class="btn s" onclick="editor('sale',${id})">${ic('sale',16)}Issue / sell</button><button class="btn s" onclick="openEdit('itemMaster',${id})">Edit item</button></div>`)}

function docs(k){
 const P=k=='purchase',all=D[k],rows=all.filter(d=>tf=='All'||d.status==tf).map(d=>({id:d.id,no:d.no,date:d.date,partyId:d.party,party:P?lbl('supplier',d.party):d.party,items:d.lines.length,total:tot(d),cur:lbl('currency',d.cur),docs:(d.docs||[]).length,st:d.status}));
 return `<div class="hd"><div><h1>${P?'Purchases':'Sales & issues'}</h1><p class="sub">${P?'Goods received from suppliers.':'Goods sold or issued out of stock.'} Posting a document updates stock.<span class="tag">${P?'PurchaseInvoice':'IssueSale'}</span></p></div><div class="ac">${P?`<button class="btn s" onclick="openImport()">${ic('up',15)}Import from Excel</button>`:''}<button class="btn" onclick="editor('${k}')">${ic('plus',15)}${P?'Receive stock':'New sale / issue'}</button></div></div>
 <div class="pills">${['All','Draft','Posted','Cancelled'].map(t=>`<button class="${tf==t?'on':''}" onclick="tf='${t}';if(GS.d_${k})GS.d_${k}.page=1;render()">${t} (${t=='All'?all.length:all.filter(d=>d.status==t).length})</button>`).join('')}</div>`+
 grid('d_'+k,[{k:'no',l:'Number',v:r=>r.no,h:r=>`<b>${r.no}</b>`},C('date','Date'),C('party',P?'Supplier':'Customer'),CN('items','Items'),...(P?[{k:'docs',l:'Documents',r:1,v:r=>r.docs,h:r=>r.docs?`<span class="b OK">${ic('file',12)} ${r.docs}</span>`:''}]:[]),{k:'total',l:'Total',r:1,v:r=>r.total,h:r=>r.cur+' '+n(r.total)},{k:'st',l:'Status',v:r=>r.st,h:r=>`<span class="b ${r.st}">${r.st}</span>`}],rows,{click:r=>`viewDoc('${k}',${r.id})`,name:P?'Purchases':'Sales and issues',filters:DF(k)})}
function moves(){
 const rows=D.move.slice().reverse().map(m=>{const it=item(m.item);return {id:m.id,date:m.date,itemId:m.item,type:m.type,item:it.name,what:TY[m.type],qty:m.qty,unit:lbl('unitMaster',it.unit),cost:m.cost,after:m.after,ref:m.ref}});
 return `<div class="hd"><div><h1>Stock history</h1><p class="sub">Every stock in and out, with the balance after each change. This log is never edited.<span class="tag">StockMovement</span></p></div></div>`+
 grid('move',[C('date','Date'),C('item','Item'),C('what','What happened'),{k:'qty',l:'Quantity',r:1,v:r=>r.qty,h:r=>`<span class="${r.qty>0?'pos':'neg'}">${r.qty>0?'+':''}${n(r.qty,2)}</span>`},C('unit','Unit'),CN('cost','Unit cost'),CN('after','Balance after'),C('ref','Reference')],rows,{name:'Stock history',filters:MV()})}
function setup(){const ks=['itemCategory','itemSubCategory','unitSet','unitMaster','unitConversion','currency','currencyConversion','country'];
 return `<div class="hd"><div><h1>Setup</h1><p class="sub">The reference lists that items, suppliers and documents use.</p></div></div><div class="pills">${ks.map(k=>`<button class="${stab==k?'on':''}" onclick="stab='${k}';render()">${H[k]}</button>`).join('')}</div>`+listPage(stab,true)}

/* document viewer */
function viewDoc(k,id){const d=D[k].find(x=>x.id==id),P=k=='purchase';
 drawer(`<div class="dh"><div class="av lg" style="background:${avc(d.no)}">${P?'↓':'↑'}</div><div><h2>${d.no}</h2><div class="mu">${P?'Purchase':'Sale / issue'} · ${d.date}</div></div><span class="b ${d.status}">${d.status}</span><button class="x" onclick="closeD()">×</button></div>
 <div class="db"><div class="dl"><div><span>${P?'Supplier':'Customer'}</span>${P?esc(lbl('supplier',d.party)):esc(d.party)}</div><div><span>Currency</span>${lbl('currency',d.cur)}</div></div>`+
 d.lines.map(l=>{const it=item(l.item),f=fac(it,l.unit);return `<div class="li"><div class="nm">${AV(it.name,'',it.img)}<div><b>${esc(it.name)}</b><span>${n(l.qty)} ${lbl('unitMaster',l.unit)} × ${n(l.price)}</span></div></div><div style="text-align:right"><b>${n(l.qty*l.price)}</b><div class="mu">${P?'+':'−'}${n(l.qty*f,4)} ${lbl('unitMaster',it.unit)} stock</div></div></div>`}).join('')+
 PIDOCS(k,d)+`<p class="mu" style="margin-top:16px">${d.status=='Draft'?'Draft: nothing has changed in stock yet.':d.status=='Posted'?'Posted: stock was updated. Cancelling adds reversing entries.':'Cancelled: reversing entries were written to stock history.'}</p></div>
 <div class="df"><b style="font-size:17px">${lbl('currency',d.cur)} ${n(tot(d))}</b><div class="ac">`+(d.status=='Draft'?`<button class="btn g" onclick="askPost('${k}',${id})">Post to stock</button>`:d.status=='Posted'?`<button class="btn d" onclick="askCancel('${k}',${id})">Cancel &amp; reverse</button>`:'')+`</div></div>`)}
function summ(d,P){return d.lines.map(l=>{const it=item(l.item);return `${P?'+':'−'}${n(l.qty*fac(it,l.unit),4)} ${lbl('unitMaster',it.unit)} ${esc(it.name)}`}).join('<br>')}
const busy=(t,fn)=>{const b=$('mok');b.disabled=true;b.innerHTML='<i class="spn"></i> '+t;lo(1);setTimeout(()=>{closeM();lo(0);fn()},550);return false};
function askPost(k,id){const d=D[k].find(x=>x.id==id),P=k=='purchase';modal('Post '+d.no+'?',`<p style="margin-top:0">This updates stock immediately:</p><p><b>${summ(d,P)}</b></p><p class="mu">You can cancel it later; that writes reversing entries.</p>`,['Post to stock','g'],()=>busy('Posting…',()=>post(k,id)))}
function askCancel(k,id){const d=D[k].find(x=>x.id==id),P=k=='purchase';modal('Cancel '+d.no+'?',`<p style="margin-top:0">These stock changes will be reversed:</p><p><b>${summ(d,!P)}</b></p>`,['Cancel document','d'],()=>busy('Cancelling…',()=>cancel(k,id)))}

/* document editor (slide-over with item search) */
function editor(k,pre){closeM();closeD();const P=k=='purchase';ed={k,date:today(),party:P?1:'',type:'Sale',cur:1,lines:[],docs:[]};
 const m=document.createElement('div');m.id='mo';m.className='mo';
 m.innerHTML=`<div class="md xl"><div class="mh"><div class="nm"><div class="av lg" style="background:${P?'var(--ok)':'var(--in)'}">${P?'↓':'↑'}</div><div><b style="font-size:17px">${P?'Receive stock':'Sell or issue stock'}</b><div class="mu" style="font-weight:400">${P?'Record a purchase from a supplier':'Record items leaving your stock'}</div></div></div><div class="ac">${P?`<button class="btn s" onclick="openImport()">${ic('up',15)}Import from Excel</button>`:''}<button class="x" onclick="closeM()">×</button></div></div>
 <div class="mb"><div class="fm" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"><label class="fl">Date<input type="date" value="${ed.date}" onchange="ed.date=this.value"></label>`+
 (P?`<label class="fl">Supplier<select onchange="ed.party=+this.value">${opts('supplier',1)}</select></label>`:`<label class="fl">Customer<input placeholder="e.g. Walk-in customer" onchange="ed.party=this.value"></label><label class="fl">Type<select onchange="ed.type=this.value"><option value="Sale">Sale</option><option value="InternalIssue">Internal use</option><option value="Damage">Damaged</option><option value="Sample">Sample</option></select></label>`)+
 `<label class="fl">Currency<select onchange="ed.cur=+this.value">${opts('currency',1)}</select></label></div>
 <div class="sgw" style="margin:20px 0 6px"><label class="fl">Add items<input id="eq" autocomplete="off" placeholder="Search by name or code, then press Enter…" oninput="edSearch(this.value)" onfocus="edSearch(this.value)" onblur="setTimeout(()=>{const s=$('sug');if(s)s.innerHTML=''},150)"></label><div id="sug"></div></div><div id="lines"></div>${P?`<div style="margin-top:10px"><label class="btn s">${ic('up',15)}Attach documents (optional)<input type="file" multiple hidden accept="${FTA}" onchange="edDocAdd(this)"></label><div id="edocs"></div></div>`:''}</div>
 <div class="mf" style="justify-content:space-between;align-items:center"><b id="tot" style="font-size:17px"></b><div class="ac"><button class="btn s" onclick="closeM()">Discard</button><button class="btn s" id="esd" onclick="edSave(false)">Save draft</button><button class="btn g" id="esp" onclick="edSave(true)">Save &amp; post</button></div></div></div>`;
 document.body.appendChild(m);
 $('eq').onkeydown=e=>{if(e.key=='Enter'){const f=document.querySelector('#sug .sg');if(f)edAdd(+f.dataset.id)}};
 if(pre)edAdd(pre);else{edLines();$('eq').focus()}}
function edSearch(v){v=v.toLowerCase();const r=D.itemMaster.filter(i=>!i.del&&(i.name+i.code).toLowerCase().includes(v)).slice(0,6);
 $('sug').innerHTML=r.length?`<div class="sgl">`+r.map(i=>`<div class="sg" data-id="${i.id}" onmousedown="event.preventDefault();edAdd(${i.id})">${AV(i.name,'',i.img)}<div><b>${esc(i.name)}</b><div class="mu">${i.code}</div></div><span class="mu">${n(bal(i.id).qty,2)} ${lbl('unitMaster',i.unit)} in stock</span></div>`).join('')+`</div>`:''}
function edAdd(id){const it=item(id),P=ed.k=='purchase',l=ed.lines.find(x=>x.item==id);if(l)l.qty++;else ed.lines.push({item:id,unit:it.unit,qty:1,price:P?it.cost:it.price});$('sug').innerHTML='';$('eq').value='';edLines();$('eq').focus()}
function edSet(i,f,v){const P=ed.k=='purchase',l=ed.lines[i],it=item(l.item);if(f=='unit'){l.unit=+v;l.price=(P?it.cost:it.price)*fac(it,l.unit)}else l[f]=Math.max(0,+v);edLines()}
function edQ(i,d){ed.lines[i].qty=Math.max(1,ed.lines[i].qty+d);edLines()}
function edLines(){const P=ed.k=='purchase';let bad=false;
 $('lines').innerHTML=ed.lines.length?ed.lines.map((l,i)=>{const it=item(l.item),av=bal(it.id).qty,over=!P&&l.qty*fac(it,l.unit)>av+1e-9;if(over)bad=true;
 return `<div class="ln"><div class="nm">${AV(it.name,'',it.img)}<div><b>${esc(it.name)}</b><span class="${over?'warn':''}">${over?'Only ':'In stock: '}${n(av,2)} ${lbl('unitMaster',it.unit)}${over?' available':''}</span></div></div><select onchange="edSet(${i},'unit',this.value)">${unitsOf(it).map(u=>`<option value="${u}" ${u==l.unit?'selected':''}>${lbl('unitMaster',u)}</option>`).join('')}</select><div class="stp"><button onclick="edQ(${i},-1)">−</button><input type="number" value="${l.qty}" onchange="edSet(${i},'qty',this.value)"><button onclick="edQ(${i},1)">+</button></div><input type="number" value="${l.price}" title="${P?'Unit cost':'Unit price'}" onchange="edSet(${i},'price',this.value)"><b style="text-align:right">${n(l.qty*l.price)}</b><button class="x" onclick="ed.lines.splice(${i},1);edLines()">×</button></div>`}).join('')+(bad?'<p class="warn">Some quantities are more than you have in stock, so posting will be blocked.</p>':''):`<div class="empty"><b>No items yet</b>Search above and press Enter to add your first item.</div>`;
 $('tot').textContent='Total: '+lbl('currency',ed.cur)+' '+n(tot(ed))}
function edSave(andPost){const k=ed.k,P=k=='purchase';
 if(!ed.lines.length)return toast('Add at least one item',1);if(!P&&!ed.party)return toast('Enter a customer name',1);if(ed.lines.some(l=>!(l.qty>0)))return toast('Quantities must be above zero',1);
 const b=$(andPost?'esp':'esd');b.disabled=true;b.innerHTML='<i class="spn"></i> '+(andPost?'Posting…':'Saving…');lo(1);
 setTimeout(()=>{const d={id:nid(),no:(P?'PI-':'IS-')+String(D[k].length+101).padStart(4,'0'),date:ed.date,party:ed.party,type:ed.type,cur:ed.cur,status:'Draft',lines:ed.lines,docs:ed.docs||[],cr:now()};

/* posting logic */
function post(k,id){
 const P=k=='purchase',d=D[k].find(x=>x.id==id);
 if(!P){const need={};d.lines.forEach(l=>{need[l.item]=(need[l.item]||0)+l.qty*fac(item(l.item),l.unit)});
  for(const i in need){if(bal(+i).qty<need[i]-1e-9)return toast('Not enough stock for '+item(+i).name+' (available '+n(bal(+i).qty,4)+')',1)}}
 d.lines.forEach(l=>{const it=item(l.item),f=fac(it,l.unit),q=l.qty*f,b=bal(it.id);
  if(P){const c=l.price/f,nq=b.qty+q;b.avg=nq?(b.qty*b.avg+q*c)/nq:c;b.qty=nq;b.last=c;D.move.push({id:nid(),date:d.date,item:it.id,type:'PurchaseIn',qty:q,cost:c,after:b.qty,ref:d.no})}
  else{l.cost=b.avg;b.qty-=q;D.move.push({id:nid(),date:d.date,item:it.id,type:d.type=='Sale'?'SaleOut':'IssueOut',qty:-q,cost:b.avg,after:b.qty,ref:d.no})}});
 d.status='Posted';closeD();toast(d.no+' posted. Stock levels are updated.');render()}
function cancel(k,id){
 const P=k=='purchase',d=D[k].find(x=>x.id==id);
 if(P){for(const l of d.lines){const it=item(l.item);if(bal(it.id).qty<l.qty*fac(it,l.unit)-1e-9)return toast('Cannot cancel: stock already used for '+it.name,1)}}
 d.lines.forEach(l=>{const it=item(l.item),q=l.qty*fac(it,l.unit),b=bal(it.id),s=P?-q:q;b.qty+=s;D.move.push({id:nid(),date:today(),item:it.id,type:P?'PurchaseReturnOut':'SaleReturnIn',qty:s,cost:l.cost||b.avg,after:b.qty,ref:d.no+' (cancel)'})});
 d.status='Cancelled';closeD();toast(d.no+' cancelled. Reversing entries written.');render()}

let IMP=[];
function openImport(){closeD();IMP=[];shell('<b>Import receipts from Excel</b>',`<p style="margin-top:0">Upload an .xlsx or .csv file. One <b>purchase invoice</b> is created for every distinct <b>InvoiceNo</b> in the file.</p><div class="card" style="padding:12px;margin-bottom:14px"><span class="mu">Columns:</span> InvoiceNo, InvoiceDate, SupplierCode, ItemCode, Unit, Quantity, UnitCost, Currency (optional). Invoice numbers that already exist are skipped.</div><div class="ac"><input type="file" id="impf" accept=".xlsx,.xls,.csv" onchange="impFile(this.files[0])"><button class="btn s" onclick="impTpl()">${ic('dl',15)}Download template</button></div><div id="impv" style="margin-top:16px"></div>`,
 `<button class="btn s" onclick="closeM()">Cancel</button><button class="btn" id="impd" disabled onclick="impCreate(false)">Create drafts</button><button class="btn g" id="impp" disabled onclick="impCreate(true)">Create &amp; post</button>`,'xl')}
function impTpl(){return xl('Receive stock',['InvoiceNo','InvoiceDate','SupplierCode','ItemCode','Unit','Quantity','UnitCost','Currency'],[['INV-1001',today(),'SUP-001','ITM-003','BOX',5,1440,'BDT'],['INV-1001',today(),'SUP-001','ITM-004','PCS',10,1500,'BDT'],['INV-1002',today(),'SUP-002','ITM-005','KG',20,600,'BDT']],'receive-stock-template.xlsx')}
async function impFile(f){if(!f)return;if(!window.XLSX)return toast('The Excel library did not load. Check your connection.',1);
 $('impv').innerHTML='<div class="ld"><i class="spn"></i> Reading file…</div>';lo(1);try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});impBuild(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true}))}catch(e){toast('Could not read that file',1)}lo(0)}
const dstr=v=>v instanceof Date?new Date(v.getTime()+432e5).toISOString().slice(0,10):typeof v=='number'?new Date(Math.round((v-25569)*864e5)+432e5).toISOString().slice(0,10):String(v).trim().slice(0,10);
function impBuild(rows){
 const g=(r,ns)=>{for(const k in r){if(ns.includes(k.toLowerCase().replace(/[^a-z]/g,'')))return r[k]}return ''},T=v=>String(v).trim().toLowerCase(),docs={},order=[];
 rows.forEach((r,i)=>{const no=String(g(r,['invoiceno','documentno','docno','invoicenumber','documentnumber','invoice'])).trim(),ic0=T(g(r,['itemcode','item','sku']));if(!no&&!ic0)return;
  const d=docs[no]||(docs[no]={no,date:'',sup:null,supl:'',cur:1,lines:[],errs:[]},order.push(no),docs[no]),ln='Row '+(i+2)+': ';
  if(!no)d.errs.push(ln+'missing InvoiceNo');
  const dv=g(r,['invoicedate','date','documentdate']),ds=dv===''?today():dstr(dv);if(!/^\d{4}-\d{2}-\d{2}$/.test(ds))d.errs.push(ln+'invalid date');else if(!d.date)d.date=ds;
  const st=T(g(r,['suppliercode','supplier','suppliername'])),sp=D.supplier.find(x=>!x.del&&(T(x.code)==st||T(x.name)==st));
  if(!sp)d.errs.push(ln+'unknown supplier "'+st+'"');else if(d.sup&&d.sup!=sp.id)d.errs.push(ln+'different supplier within the same invoice');else{d.sup=sp.id;d.supl=sp.name}
  const cc=T(g(r,['currency','currencycode']));if(cc){const cu=D.currency.find(x=>!x.del&&T(x.code)==cc);if(cu)d.cur=cu.id;else d.errs.push(ln+'unknown currency "'+cc+'"')}
  const it=D.itemMaster.find(x=>!x.del&&(T(x.code)==ic0||T(x.name)==ic0));if(!it)return d.errs.push(ln+'unknown item "'+ic0+'"');
  const ut=T(g(r,['unit','uom','unitcode'])),un=ut?unitsOf(it).find(x=>T(lbl('unitMaster',x))==ut):it.unit;if(!un)return d.errs.push(ln+'unit "'+ut+'" is not valid for '+it.name);
  const q=+g(r,['quantity','qty']);if(!(q>0))return d.errs.push(ln+'quantity must be above zero');
  const cv=g(r,['unitcost','cost','price','unitprice']),pr=cv===''?it.cost*fac(it,un):+cv;if(isNaN(pr)||pr<0)return d.errs.push(ln+'invalid unit cost');
  d.lines.push({item:it.id,unit:un,qty:q,price:pr})});
 IMP=order.map(no=>{const d=docs[no],ex=!!no&&D.purchase.some(p=>p.no.toLowerCase()==no.toLowerCase());if(!d.lines.length&&!d.errs.length)d.errs.push('No valid lines');
  return Object.assign(d,{st:d.errs.length?'Error':ex?'Exists':'Ready',msg:d.errs.length?d.errs[0]+(d.errs.length>1?' (+'+(d.errs.length-1)+' more)':''):ex?'Already in the system, skipped':'',total:tot(d),n:d.lines.length,no:no||'(no number)'})});
 delete GS.imp;const ok=IMP.filter(d=>d.st=='Ready').length;
 $('impv').innerHTML=`<p><b>${ok}</b> invoice${ok==1?'':'s'} ready, <b>${IMP.length-ok}</b> skipped or with errors.</p>`+(IMP.length?grid('imp',[C('no','Invoice no'),C('date','Date'),C('supl','Supplier'),CN('n','Lines'),CN('total','Total'),{k:'st',l:'Result',v:r=>r.st+(r.msg?': '+r.msg:''),h:r=>`<span class="b ${r.st=='Ready'?'OK':r.st=='Exists'?'Draft':'Out'}">${r.st}</span> <span class="mu">${esc(r.msg)}</span>`}],IMP,{name:'Import preview'}):'<div class="empty"><b>No rows found</b>Check that the first row has the column headings.</div>');
 gRender('imp');$('impd').disabled=$('impp').disabled=!ok}
function impCreate(p){const b=$(p?'impp':'impd');b.disabled=true;b.innerHTML='<i class="spn"></i> Creating…';lo(1);setTimeout(()=>{lo(0);impDo(p)},500)}
function impDo(p){const ok=IMP.filter(d=>d.st=='Ready');
 ok.forEach(d=>{const doc={id:nid(),no:d.no,date:d.date||today(),party:d.sup,cur:d.cur,status:'Draft',lines:d.lines,cr:now()};D.purchase.push(doc);if(p)post('purchase',doc.id)});
 closeM();view='purchase';tf='All';render();toast(ok.length+' invoice'+(ok.length==1?'':'s')+(p?' created and posted':' created as drafts'))}

/* ---------- reports ---------- */
let RP={k:'stock',from:day(-30),to:day(0),item:'',supplier:'',status:'',cat:'',type:''},RPB=null;
const inR=d=>d>=RP.from&&d<=RP.to;
function fifo(){const L={};D.move.slice().sort((a,b)=>a.id-b.id).forEach(m=>{const a=L[m.item]=L[m.item]||[];
 if(m.type=='Opening'||m.type=='PurchaseIn')a.push({ref:m.ref,date:m.date,item:m.item,rec:m.qty,sold:0,cost:m.cost,op:m.type=='Opening'});
 else if(m.type=='SaleOut'||m.type=='IssueOut'){let q=-m.qty;for(const l of a){const f=Math.min(q,l.rec-l.sold);if(f>0){l.sold+=f;q-=f}if(q<=1e-9)break}}
 else if(m.type=='PurchaseReturnOut'){const l=a.find(x=>x.ref==m.ref.replace(' (cancel)',''));if(l)l.rec+=m.qty}
 else if(m.type=='SaleReturnIn'){let q=m.qty;for(let i=a.length-1;i>=0&&q>0;i--){const f=Math.min(q,a[i].sold);a[i].sold-=f;q-=f}}});
 return [].concat(...Object.values(L)).filter(l=>!l.op)}
const REP={
stock:{name:'Stock item list',desc:'Current stock, cost and value of every item.',p:['cat','stat'],build(){
 const rows=D.itemMaster.filter(i=>!i.del&&(RP.cat===''||i.cat==RP.cat)).map(i=>{const b=bal(i.id);return {code:i.code,name:i.name,cat:lbl('itemCategory',i.cat),unit:lbl('unitMaster',i.unit),qty:b.qty,avg:b.avg,val:b.qty*b.avg,re:i.reorder,st:SL[stat(b)]}}).filter(r=>!RP.status||r.st==RP.status);
 return {cols:[C('code','Code'),C('name','Item'),C('cat','Category'),C('unit','Unit'),CN('qty','On hand'),CN('avg','Avg cost'),CN('val','Value'),CN('re','Reorder level'),C('st','Status')],rows,tot:[['Items',rows.length],['Total value','৳ '+n(rows.reduce((s,r)=>s+r.val,0))]]}}},
ledger:{name:'Item ledger',desc:'Every movement of one item with a running balance.',p:['dates','item'],build(){
 const id=RP.item===''?D.itemMaster.find(i=>!i.del).id:RP.item,it=item(id),ms=D.move.filter(m=>m.item==id).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id),open=ms.filter(m=>m.date<RP.from).reduce((s,m)=>s+m.qty,0);let bl=open;
 const rows=[{date:RP.from,ref:'',desc:'Opening balance',inq:null,outq:null,cost:null,bal:open}];
 ms.filter(m=>inR(m.date)).forEach(m=>{bl+=m.qty;rows.push({date:m.date,ref:m.ref,desc:TY[m.type],inq:m.qty>0?m.qty:null,outq:m.qty<0?-m.qty:null,cost:m.cost,bal:bl})});
 const ti=rows.reduce((s,r)=>s+(r.inq||0),0),to=rows.reduce((s,r)=>s+(r.outq||0),0);
 return {cols:[C('date','Date'),C('ref','Reference'),C('desc','Description'),CN('inq','In'),CN('outq','Out'),CN('cost','Unit cost'),CN('bal','Balance')],rows,tot:[['Item',it.name+' ('+lbl('unitMaster',it.unit)+')'],['Opening',n(open)],['Total in',n(ti)],['Total out',n(to)],['Closing',n(bl)]]}}},
invoices:{name:'Invoice list',desc:'Purchase invoices in a date range.',p:['dates','supplier','status'],build(){
 const rows=D.purchase.filter(d=>inR(d.date)&&(RP.supplier===''||d.party==RP.supplier)&&(!RP.status||d.status==RP.status)).map(d=>({no:d.no,date:d.date,sup:lbl('supplier',d.party),items:d.lines.length,cur:lbl('currency',d.cur),tot:tot(d),st:d.status}));
 return {cols:[C('no','Invoice no'),C('date','Date'),C('sup','Supplier'),CN('items','Items'),C('cur','Currency'),CN('tot','Total'),C('st','Status')],rows,tot:[['Invoices',rows.length],['Total (excluding cancelled)',n(rows.filter(r=>r.st!='Cancelled').reduce((s,r)=>s+r.tot,0))]]}}},
sales:{name:'Sales list',desc:'Sales and issues with cost and margin.',p:['dates','status','type'],build(){
 const rows=D.sale.filter(d=>inR(d.date)&&(!RP.status||d.status==RP.status)&&(!RP.type||d.type==RP.type)).map(d=>{const po=d.status=='Posted',t=tot(d),c=po?d.lines.reduce((s,l)=>s+l.qty*fac(item(l.item),l.unit)*(l.cost||0),0):0;return {no:d.no,date:d.date,cus:d.party,type:d.type,items:d.lines.length,tot:t,cost:c,mar:po?t-c:0,st:d.status}});
 const P=rows.filter(r=>r.st=='Posted');
 return {cols:[C('no','Number'),C('date','Date'),C('cus','Customer'),C('type','Type'),CN('items','Items'),CN('tot','Total'),CN('cost','Cost'),CN('mar','Margin'),C('st','Status')],rows,tot:[['Documents',rows.length],['Sales total',n(rows.filter(r=>r.st!='Cancelled').reduce((s,r)=>s+r.tot,0))],['Cost (posted)',n(P.reduce((s,r)=>s+r.cost,0))],['Margin (posted)',n(P.reduce((s,r)=>s+r.mar,0))]]}}},
i2s:{name:'Invoice to sales',desc:'How much of each purchase invoice has been sold (first in, first out).',p:['dates','itemAll'],build(){
 const rows=fifo().filter(l=>inR(l.date)&&(RP.item===''||l.item==RP.item)).map(l=>{const it=item(l.item),sp=it.price,rem=l.rec-l.sold;return {ref:l.ref,date:l.date,item:it.name,unit:lbl('unitMaster',it.unit),rec:l.rec,sold:l.sold,rem,cost:l.cost,csold:l.sold*l.cost,sval:l.sold*sp,mar:l.sold*(sp-l.cost)}});
 return {cols:[C('ref','Invoice'),C('date','Date'),C('item','Item'),C('unit','Unit'),CN('rec','Received'),CN('sold','Sold'),CN('rem','Remaining'),CN('cost','Unit cost'),CN('csold','Cost of sold'),CN('sval','Sales value*'),CN('mar','Margin*')],rows,tot:[['Invoices lines',rows.length],['Cost of sold',n(rows.reduce((s,r)=>s+r.csold,0))],['Sales value*',n(rows.reduce((s,r)=>s+r.sval,0))],['Margin*',n(rows.reduce((s,r)=>s+r.mar,0))],['* at current sale price','']]}}}
};
function rpPick(k){RP.k=k;RP.item=k=='ledger'?D.itemMaster.find(i=>!i.del).id:'';RP.status=RP.type=RP.supplier=RP.cat='';delete GS.rp;render()}
function rpS(k,v){RP[k]=['item','supplier','cat'].includes(k)&&v!==''?+v:v;delete GS.rp;render()}
const op=(a,s)=>a.map(([v,l])=>`<option value="${v}" ${String(v)==String(s)?'selected':''}>${esc(l)}</option>`).join('');
function rpParams(){const p=REP[RP.k].p,o=[],L=(l,h)=>`<label class="fl">${l}${h}</label>`;
 if(p.includes('dates'))o.push(L('From',`<input type="date" value="${RP.from}" onchange="rpS('from',this.value)">`),L('To',`<input type="date" value="${RP.to}" onchange="rpS('to',this.value)">`));
 if(p.includes('item'))o.push(L('Item',`<select onchange="rpS('item',this.value)">${op(D.itemMaster.filter(i=>!i.del).map(i=>[i.id,i.name]),RP.item)}</select>`));
 if(p.includes('itemAll'))o.push(L('Item',`<select onchange="rpS('item',this.value)">${op([['','All items']].concat(D.itemMaster.filter(i=>!i.del).map(i=>[i.id,i.name])),RP.item)}</select>`));
 if(p.includes('cat'))o.push(L('Category',`<select onchange="rpS('cat',this.value)">${op([['','All categories']].concat(D.itemCategory.filter(i=>!i.del).map(i=>[i.id,i.name])),RP.cat)}</select>`));
 if(p.includes('supplier'))o.push(L('Supplier',`<select onchange="rpS('supplier',this.value)">${op([['','All suppliers']].concat(D.supplier.filter(i=>!i.del).map(i=>[i.id,i.name])),RP.supplier)}</select>`));
 if(p.includes('stat'))o.push(L('Status',`<select onchange="rpS('status',this.value)">${op([['','All'],['In stock','In stock'],['Low stock','Low stock'],['Out of stock','Out of stock']],RP.status)}</select>`));
 if(p.includes('status'))o.push(L('Status',`<select onchange="rpS('status',this.value)">${op([['','All'],['Draft','Draft'],['Posted','Posted'],['Cancelled','Cancelled']],RP.status)}</select>`));
 if(p.includes('type'))o.push(L('Type',`<select onchange="rpS('type',this.value)">${op([['','All'],['Sale','Sale'],['InternalIssue','Internal use'],['Damage','Damaged'],['Sample','Sample']],RP.type)}</select>`));
 return o.join('')}
function ptxt(){const p=REP[RP.k].p,a=[];if(p.includes('dates'))a.push('Period: '+RP.from+' to '+RP.to);if((p.includes('item')||p.includes('itemAll'))&&RP.item!=='')a.push('Item: '+lbl('itemMaster',RP.item));if(p.includes('supplier')&&RP.supplier!=='')a.push('Supplier: '+lbl('supplier',RP.supplier));if(p.includes('cat')&&RP.cat!=='')a.push('Category: '+lbl('itemCategory',RP.cat));if((p.includes('status')||p.includes('stat'))&&RP.status)a.push('Status: '+RP.status);if(p.includes('type')&&RP.type)a.push('Type: '+RP.type);return a.join(' · ')||'All records'}
function reports(){const rep=REP[RP.k];RPB=rep.build();
 return `<div class="hd"><div><h1>Reports</h1><p class="sub">Choose a report, set the filters, then print it or export it to Excel.</p></div></div>
 <div class="rpc">${Object.keys(REP).map(k=>`<button class="${RP.k==k?'on':''}" onclick="rpPick('${k}')"><b>${REP[k].name}</b><span>${REP[k].desc}</span></button>`).join('')}</div>
 <div class="card"><div class="fg" style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">${rpParams()}<span class="sp"></span><button class="btn s" onclick="rpSave()">${ic('dl',15)}Save printable copy</button><button class="btn" onclick="rpPrint()">${ic('print',15)}Print</button></div></div>
 <div class="sm">${RPB.tot.map(t=>`<div><span>${esc(t[0])}</span><b>${esc(t[1])}</b></div>`).join('')}</div>`+grid('rp',RPB.cols,RPB.rows,{name:rep.name})+(RP.k=='i2s'?'<p class="mu">* Sales value and margin use each item’s current sale price, because stock history stores cost only.</p>':'')}
function sheet(){const rep=REP[RP.k],rows=gData('rp'),cs=G.rp.cols.filter(c=>!c.noexp);
 return `<div class="sh"><div class="shh"><div><h1>${rep.name}</h1><b>Acme Traders</b></div><div style="text-align:right">Printed ${now()}<br>${esc(ptxt())}</div></div><table><thead><tr>${cs.map(c=>`<th class="${c.r?'r':''}">${c.l}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cs.map(c=>`<td class="${c.r?'r':''}">${c.h?c.h(r):esc(c.v(r))}</td>`).join('')}</tr>`).join('')}</tbody></table><p><b>${RPB.tot.map(t=>esc(t[0])+(t[1]===''?'':': '+esc(t[1]))).join(' · ')}</b></p></div>`}
function rpPrint(){$('prn').innerHTML=sheet();setTimeout(()=>{try{window.print()}catch(e){toast('Printing is blocked in this view. Use Save printable copy.',1)}},60)}
function rpSave(){const css='body{font:12px Arial,sans-serif;margin:24px;color:#000}.shh{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}h1{font-size:18px;margin:0}table{width:100%;border-collapse:collapse}th{background:#eee;border-bottom:1px solid #000;padding:4px 6px;text-align:left}td{padding:4px 6px;border-bottom:1px solid #ddd}.r{text-align:right}';
 return save(REP[RP.k].name.replace(/\W+/g,'_')+'.html','<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+REP[RP.k].name+'</title><style>'+css+'</style></head><body>'+sheet()+'</body></html>')}

function render(){nav();topbar();const f={dash,items,purchase:()=>docs('purchase'),sale:()=>docs('sale'),move:moves,supplier:()=>listPage('supplier'),reports,setup}[view];$('pg').innerHTML=f();Object.keys(G).forEach(id=>{if($('gb_'+id))gRender(id)});window.scrollTo(0,0);cu()}
loginUI();render();
</script></body></html>
