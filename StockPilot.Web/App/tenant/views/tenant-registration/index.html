<section class="public-card public-form-card wide"><span class="public-kicker">{{kicker}}</span><h1>{{title}}</h1><p>{{intro}}</p>{{messageBlock}}<form class="public-form" data-form="register">
<fieldset class="public-group"><legend>{{storeGroup}}</legend>
<div class="public-row"><div class="public-field"><label for="store-name">{{storeName}}</label><input id="store-name" name="Name" required maxlength="128" placeholder="{{storeNameHint}}"></div><div class="public-field"><label for="store-workspace">{{workspace}}</label><input id="store-workspace" name="TenancyName" required maxlength="64" pattern="[A-Za-z][A-Za-z0-9_\-]*" autocapitalize="none" value="{{tenancyName}}" placeholder="your-store"><small>{{workspaceHint}}</small></div></div>
<div class="public-row"><div class="public-field"><label for="contact-name">{{contactName}}</label><input id="contact-name" name="ContactName" autocomplete="name" maxlength="128"></div><div class="public-field"><label for="contact-phone">{{contactPhone}}</label><input id="contact-phone" name="ContactPhone" type="tel" autocomplete="tel" required maxlength="32" placeholder="+880 1XXXXXXXXX"></div></div>
<div class="public-row"><div class="public-field"><label for="contact-email">{{contactEmail}}</label><input id="contact-email" name="ContactEmail" type="email" autocomplete="email" maxlength="256"></div><div class="public-field"><label for="business-type">{{businessType}}</label><input id="business-type" name="BusinessType" maxlength="64" list="business-types" placeholder="{{businessTypeHint}}"><datalist id="business-types">{{businessTypeOptions}}</datalist></div></div>
<div class="public-field"><label for="address">{{address}}</label><input id="address" name="Address" autocomplete="street-address" maxlength="512"></div>
<div class="public-row"><div class="public-field"><label for="city">{{city}}</label><input id="city" name="City" autocomplete="address-level2" maxlength="128"></div><div class="public-field"><label for="country">{{country}}</label><input id="country" name="CountryName" autocomplete="country-name" maxlength="128"></div></div>
<div class="public-field"><label for="notes">{{notes}}</label><textarea id="notes" name="Notes" rows="2" maxlength="2000" placeholder="{{notesHint}}"></textarea></div>
</fieldset>
<fieldset class="public-group"><legend>{{adminGroup}}</legend>
<div class="public-row"><div class="public-field"><label for="admin-name">{{adminName}}</label><input id="admin-name" name="AdminName" autocomplete="given-name" required maxlength="32"></div><div class="public-field"><label for="admin-surname">{{adminSurname}}</label><input id="admin-surname" name="AdminSurname" autocomplete="family-name" required maxlength="32"></div></div>
<div class="public-row"><div class="public-field"><label for="admin-email">{{adminEmail}}</label><input id="admin-email" name="AdminEmailAddress" type="email" autocomplete="email" required maxlength="256" placeholder="you@example.com"></div><div class="public-field"><label for="admin-phone">{{adminPhone}}</label><input id="admin-phone" name="AdminPhoneNumber" type="tel" autocomplete="tel" required maxlength="24" placeholder="+880 1XXXXXXXXX"></div></div>
<div class="public-field"><label for="admin-password">{{adminPassword}}</label><input id="admin-password" name="AdminPassword" type="password" autocomplete="new-password" required minlength="6" maxlength="128" pattern="(?=.*[a-z])(?=.*[0-9]).{6,128}" title="{{passwordHint}}"><small>{{passwordHint}}</small></div>
</fieldset>
<div data-react-slot></div><button class="public-button" type="submit">{{submit}}</button></form><div class="public-form-links"><a href="#/login">{{signInLink}}</a><a href="#/register-status">{{statusLink}}</a></div></section>
