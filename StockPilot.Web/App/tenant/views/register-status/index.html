<section class="public-card public-form-card"><span class="public-kicker">{{kicker}}</span><h1>{{title}}</h1><p>{{intro}}</p><form class="public-form" data-form="register-status"><div class="public-field"><label for="request-no">{{requestNoLabel}}</label><input id="request-no" name="requestNo" required maxlength="32" autocapitalize="characters" value="{{requestNo}}" placeholder="TR-00001"></div><div class="public-field"><label for="request-email">{{emailLabel}}</label><input id="request-email" name="email" type="email" required maxlength="256" autocomplete="email" placeholder="you@example.com"></div><button class="public-button" type="submit">{{check}}</button></form><div data-react-slot></div><div class="public-form-links"><a href="#/register">{{newRequest}}</a><a href="#/login">{{signIn}}</a></div></section>
